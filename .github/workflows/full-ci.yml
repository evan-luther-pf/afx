name: Full CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Build binary
        shell: bash
        run: |
          started_at=$SECONDS
          printf "Starting build (%s)...\n" "${{ matrix.optimize }}"
          zig build -Doptimize=${{ matrix.optimize }}
          printf "Build completed in %ss\n" "$((SECONDS - started_at))"

      - name: Run unit tests
        shell: bash
        run: |
          started_at=$SECONDS
          printf "Starting unit tests (%s)...\n" "${{ matrix.optimize }}"
          zig build test -Doptimize=${{ matrix.optimize }}
          printf "Unit tests completed in %ss\n" "$((SECONDS - started_at))"

      - name: Smoke test fresh binary
        shell: bash
        run: |
          help_stdout="$(mktemp)"
          help_stderr="$(mktemp)"
          status_stdout="$(mktemp)"
          status_stderr="$(mktemp)"
          trap 'rm -f "$help_stdout" "$help_stderr" "$status_stdout" "$status_stderr"' EXIT

          ./zig-out/bin/afx help >"$help_stdout" 2>"$help_stderr"
          test -s "$help_stdout"
          test ! -s "$help_stderr"

          ./zig-out/bin/afx status --json >"$status_stdout" 2>"$status_stderr"
          test -s "$status_stdout"
          test ! -s "$status_stderr"

  e2e:
    name: E2E (${{ matrix.optimize }}, ${{ matrix.platform.name }}, shard ${{ matrix.shard.label }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            zig_tarball: zig-x86_64-linux
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_tarball: zig-aarch64-linux
          - name: macos-x86_64
            runner: macos-15-intel
            zig_tarball: zig-x86_64-macos
          - name: macos-aarch64
            runner: macos-15
            zig_tarball: zig-aarch64-macos
        optimize: [ReleaseSafe]
        shard:
          - index: 0
            shard_count: 6
            label: "1/6"
          - index: 1
            shard_count: 6
            label: "2/6"
          - index: 2
            shard_count: 6
            label: "3/6"
          - index: 3
            shard_count: 6
            label: "4/6"
          - index: 4
            shard_count: 6
            label: "5/6"
          - index: 5
            shard_count: 6
            label: "6/6"
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-${{ hashFiles('build.zig') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-0.16.0-

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E system dependencies
        shell: bash
        timeout-minutes: 17
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            missing=()
            command -v tmux >/dev/null 2>&1 || missing+=(tmux)
            command -v zsh >/dev/null 2>&1 || missing+=(zsh)
            if [ "${#missing[@]}" -gt 0 ]; then
              retry() {
                local attempt
                for attempt in 1 2; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$attempt" -lt 2 ]; then
                    printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                    sleep 5
                  fi
                done
                return 1
              }
              # The Azure mirror can stall after APT has already fetched release
              # metadata from the direct Ubuntu fallback. Prefer that fallback
              # for the whole update when the runner's mirror list provides it.
              if [ -f /etc/apt/apt-mirrors.txt ] &&
                grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
              then
                sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
              fi
              retry sudo timeout --kill-after=15s 4m apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              retry sudo timeout --kill-after=15s 3m apt-get \
                -o Dpkg::Use-Pty=0 \
                install -y "${missing[@]}"
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run deterministic E2E shard
        shell: bash
        working-directory: tests/e2e
        run: |
          selected=()
          selection_file="$RUNNER_TEMP/afx-e2e-shard-${SHARD_INDEX}.txt"
          bun ci-shards.ts \
            --shard-count "$SHARD_COUNT" \
            --shard-index "$SHARD_INDEX" > "$selection_file"
          while IFS= read -r test_file; do
            selected+=("$test_file")
          done < "$selection_file"

          test "${#selected[@]}" -gt 0
          printf 'Running E2E shard %s/%s (%s files):\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"

          shard_status=0
          test_number=0
          for test_file in "${selected[@]}"; do
            tmux_tmp_dir="$RUNNER_TEMP/afx-e2e-tmux-${SHARD_INDEX}-${test_number}"
            mkdir -p "$tmux_tmp_dir"
            if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
              printf 'Retrying failed E2E file after resetting tmux: %s\n' "$test_file"
              TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
              if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
                shard_status=1
              fi
            fi
            TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
            test_number=$((test_number + 1))
          done
          exit "$shard_status"

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() }}
    needs:
      - native
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Verify native and E2E matrices
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            ([
              "Native checks (ReleaseSafe, " + $target + ")",
              (range(1; 7) as $shard
                | "E2E (ReleaseSafe, " + $target + ", shard " + ($shard | tostring) + "/6)")
            ] | sort) as $expected
            |
            [
              .jobs[]
              | select(
                  (.name == ("Native checks (ReleaseSafe, " + $target + ")")) or
                  (.name | startswith("E2E (ReleaseSafe, " + $target + ", shard "))
              )
            ] as $selected
            | (($selected | map(.name) | sort) == $expected and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"
